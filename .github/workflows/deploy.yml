name: Deploy portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pages: read
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@v5
      - uses: actions/cache@v4
        with:
          path: site/.local/pages-stats.json
          key: coding-statistics-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: coding-statistics-
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /Portfolio/
          VITE_CODING_STATS_ENDPOINT: /Portfolio/api/coding-stats.json
      - run: node --import tsx scripts/build-pages.ts
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
